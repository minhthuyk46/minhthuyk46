<title>Thẻ ngữ pháp JLPT</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* Layout: bộ lọc nhóm ở trên, một thẻ lật kiểu điện thoại ở giữa, phân trang ở dưới */
/* Màu thương hiệu Mankai lấy từ logo: cam #F37142, vàng #F3A41D */
:root{
  --bg:#fbf7f3; --surface:#ffffff; --fg:#2a1d16; --muted:#7a6a5f; --line:#efe4da;
  --brand:#f37142; --brand-2:#f3a41d;
  --accent:#dd5a2c; --accent-soft:#fde9df; --lime:#fff0dc; --lime-fg:#4a2a12;
  --use-bg:#fff7e6; --use-line:#f6d79a; --use-fg:#a05f00;
  --ex-bg:#eef4ff; --ex-line:#cbdcf7; --ex-fg:#2f5fb8;
  --note-bg:#fdecef; --note-line:#f3c3cd; --note-fg:#b0304f;
  --shuffle:#f6efe8; --orange:#f3a41d; --indigo:#f37142; --logo-light:block; --logo-dark:none;
  --f-display:"Baloo 2","Be Vietnam Pro",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,sans-serif;
  --f-ja:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17120f; --surface:#211915; --fg:#f6ece5; --muted:#b8a598; --line:#3a2c24;
  --accent:#f37142; --accent-soft:#3d2216; --lime:#3a2614; --lime-fg:#fde9d2;
  --use-bg:#2e2410; --use-line:#5c4718; --use-fg:#f6c14f;
  --ex-bg:#152239; --ex-line:#2a4166; --ex-fg:#8db4ff;
  --note-bg:#331722; --note-line:#5e2a3d; --note-fg:#f59ab8;
  --shuffle:#2b211b; --orange:#f3a41d; --indigo:#f37142; --logo-light:none; --logo-dark:block; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17120f; --surface:#211915; --fg:#f6ece5; --muted:#b8a598; --line:#3a2c24;
  --accent:#f37142; --accent-soft:#3d2216; --lime:#3a2614; --lime-fg:#fde9d2;
  --use-bg:#2e2410; --use-line:#5c4718; --use-fg:#f6c14f;
  --ex-bg:#152239; --ex-line:#2a4166; --ex-fg:#8db4ff;
  --note-bg:#331722; --note-line:#5e2a3d; --note-fg:#f59ab8;
  --shuffle:#2b211b; --orange:#f3a41d; --indigo:#f37142; --logo-light:none; --logo-dark:block; color-scheme:dark}
.brandbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:12px;border-bottom:3px solid var(--brand);border-image:linear-gradient(90deg,var(--brand),var(--brand-2)) 1}
.brandbar img{height:44px;width:auto;max-width:60%}
.logo-l{display:var(--logo-light)} .logo-d{display:var(--logo-dark)}
.brandtag{font-size:12px;color:var(--muted);text-align:right}
.badge{background:linear-gradient(135deg,var(--brand),var(--brand-2))!important}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px}
.wrap{max-width:1100px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--f-display);font-size:24px;font-weight:800;margin:0;line-height:1.2;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:12px;color:var(--muted)}
.stat b{font-variant-numeric:tabular-nums;font-size:13px}
.dot{width:8px;height:8px;border-radius:50%}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:480px}
.lv{font:inherit;font-family:var(--f-display);font-weight:800;font-size:20px;border:2px solid var(--line);background:var(--surface);color:var(--fg);border-radius:14px;padding:8px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.lv span{font-family:var(--f-body);font-weight:500;font-size:11.5px;color:var(--muted)}
.lv[aria-selected="true"]{border-color:var(--accent);background:var(--accent);color:#fff}
.lv[aria-selected="true"] span{color:#fff;opacity:.9}
.groups{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-size:12.5px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;cursor:pointer;display:flex;gap:6px;align-items:center}
.chip .n{color:var(--muted);font-variant-numeric:tabular-nums;font-size:11.5px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.chip[aria-pressed="true"] .n{color:#fff;opacity:.85}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools label{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);cursor:pointer}
.tools input[type=search]{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:7px 12px;min-width:0;flex:1 1 200px;max-width:320px}
button:focus-visible,input:focus-visible,.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stage{display:flex;align-items:center;justify-content:center;gap:28px;margin-top:8px}
.nav{width:48px;height:48px;border-radius:50%;border:0;background:var(--line);color:var(--fg);font-size:20px;cursor:pointer;flex:none}
.nav:disabled{opacity:.4;cursor:default}
.card{width:min(390px,100%);height:520px;perspective:1400px;cursor:pointer;flex:0 1 auto}
.inner{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.card.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:36px;box-shadow:0 18px 40px -20px rgba(30,50,20,.35);display:flex;flex-direction:column;overflow:hidden}
.back{transform:rotateY(180deg)}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 0}
.status{font-size:12px;border-radius:8px;padding:5px 10px;background:var(--bg);color:var(--muted)}
.status.ok{background:var(--accent-soft);color:var(--accent)}
.ico{border:0;background:none;color:var(--muted);cursor:pointer;font-size:16px;padding:6px;border-radius:8px}
.ico:hover{background:var(--bg)}
.stt{font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted)}
.body{flex:1;overflow:auto;padding:12px 16px 16px;display:flex;flex-direction:column;gap:10px;min-height:0}
.front .body{justify-content:center;align-items:center}
.badge{width:76px;height:76px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--f-ja);font-size:36px;font-weight:700;margin-bottom:-28px;position:relative;z-index:1;border:5px solid var(--surface)}
.hero{background:var(--lime);color:var(--lime-fg);border-radius:18px;padding:36px 18px 18px;text-align:center;width:100%}
.front .pattern{font-family:var(--f-ja);font-weight:700;font-size:30px;line-height:1.35;word-break:break-word}
.form{font-family:var(--f-ja);color:var(--muted);margin-top:8px;font-size:15px}
.grp{font-size:11.5px;color:var(--muted);margin-top:14px}
.back .hero{padding:16px}
.back .pattern{font-family:var(--f-ja);font-weight:700;font-size:20px}
.mean{font-size:14px;line-height:1.55;margin-top:8px;text-align:left}
.box{border-radius:14px;border:1px solid;padding:10px 12px;line-height:1.6}
.box h3{margin:0 0 4px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.use{background:var(--use-bg);border-color:var(--use-line)} .use h3{color:var(--use-fg)}
.ex{background:var(--ex-bg);border-color:var(--ex-line)} .ex h3{color:var(--ex-fg)}
.note{background:var(--note-bg);border-color:var(--note-line)} .note h3{color:var(--note-fg)}
.ja{font-family:var(--f-ja);font-size:14.5px}
.vi{font-style:italic;color:var(--muted);font-size:12.5px}
.bar{display:grid;grid-template-columns:1fr 1fr;flex:none}
.bar button{font:inherit;font-weight:600;border:0;padding:16px;cursor:pointer;display:flex;gap:8px;justify-content:center;align-items:center}
.b-shuf{background:var(--shuffle);color:var(--fg)}
.b-ok{background:var(--accent-soft);color:var(--accent)}
.b-ok[aria-pressed="true"]{background:var(--accent);color:#fff}
.hint{text-align:center;color:var(--muted);font-size:12px}
.count{text-align:center;font-variant-numeric:tabular-nums}
.pager{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.pg{font:inherit;min-width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;font-variant-numeric:tabular-nums}
.pg[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.pg:disabled{opacity:.4;cursor:default}
.empty{text-align:center;color:var(--muted);padding:60px 0}
@media (max-width:560px){.stage{gap:0}.nav{display:none}.card{height:500px}.front .pattern{font-size:26px}}
@media (prefers-reduced-motion:reduce){.inner{transition:none}}
/* Safari iOS: ẩn hẳn mặt đang úp để vòng 文 không hiện xuyên sang mặt sau */
.front{visibility:visible;transition:visibility 0s .25s}
.card.flipped .front{visibility:hidden}
.back{visibility:hidden;transition:visibility 0s .25s}
.card.flipped .back{visibility:visible}
@media (prefers-reduced-motion:reduce){.front,.back{transition:none}}
</style>

a-な/N-な） + のではあるまいか", "①Có lẽ không A đâu\n②Chẳng phải là A hay sao (văn viết - ý kiến)", "①幽霊を見たが、誰も信じまい。\n②このまま何もしないでいたら、いつまでも問題は解決しないのではあるまいか。", ""], ["115", "Bài 22 · Suy đoán, phán đoán", "Aに違いない・\nAに相違ない", "TTT(Ana ／Ana -である／N ／N -である) + に違いない / に相違ない", "Tôi tin chắc chắn sự thật là A (phán đoán)", "トムさんは車を７台も持っているから、お金持ちに違いない。", ""], ["116", "Bài 22 · Suy đoán, phán đoán", "Aに決まっている", "TTT(Ana／N) + に決まっている", "Chắc chắn là A chứ còn gì nữa (quy chụp)", "そんなうまい話はうそに決まっていますよ。", ""], ["117", "Bài 23 · Kết luận, đánh giá", "Aものだ", "V-ru／V-nai／Ai-い／Ana-な + ものだ", "A là lẽ thường tình/bản chất vốn có (chân lý)", "人間というのは本来一人では生きられないものだ。\n借りたお金は返すものだ。", ""], ["118", "Bài 23 · Kết luận, đánh giá", "Aというものだ", "TTT(Ana／N)+ というものだ", "Thật là A đấy (phán xét)", "初対面なのにそんなことを言うのは、失礼というものだ。", ""], ["119", "Bài 23 · Kết luận, đánh giá", "Aにすぎない", "TTT(Ana ／Ana -である／N ／N -である) + にすぎない", "Cũng chỉ là A thôi (không hơn)", "彼女はただの友達にすぎない。\n私にとって仕事はお金を稼ぐ手段にすぎない。", ""], ["120", "Bài 23 · Kết luận, đánh giá", "Aにほかならない", "N + にほかならない", "Chính là A (khẳng định)", "彼女が合格したのは、毎日の努力の結果にほかならない。\n親が子供を叱るのは、子供への愛情にほかならない。", ""], ["121", "Bài 23 · Kết luận, đánh giá", "Aに越したことはない", "V-ru ／ V-nai ／Ai-い／Ana -である／N -である + に越したことはない", "Không cách/lựa chọn nào qua được A → A là tốt nhất", "疲れている時には、ゆっくり休むに越したことはない。", ""], ["122", "Bài 23 · Kết luận, đánh giá", "AしかないB・Aよりほかない", "N／V-ru + しかない／ほかない／よりほかない", "Chỉ còn cách A", "友達が財布を忘れたから、私が払うほかありません。", ""], ["123", "Bài 23 · Kết luận, đánh giá", "Aべきだ・Aべきではない", "V-ru + べきだ／べきではない\n※する→すべき／するべき", "Nên A / không nên A (đạo đức)", "借りたお金は、すぐ返すべきだ。\nどんなに忙しくても、健康を無視するべきではない。\n彼の失敗から学ぶべき点は多い。", ""], ["124", "Bài 24 · Khuyên nhủ, ý chí", "Aようではないか", "V-you (thể ý chí) + ではないか\n(-ようじゃないか)", "Mọi người/ chúng ta cùng (chung tay) A nào", "環境を守るために何ができるか、考えてみようではないか。", ""], ["125", "Bài 24 · Khuyên nhủ, ý chí", "Aことだ", "V-ru / V-nai + ことだ", "Bạn nên V/không nên V (khuyên)", "太りたくなければ、夜遅く食べないことです。", ""], ["126", "Bài 24 · Khuyên nhủ, ý chí", "Aものだ・\nAものではない", "V-ru / V-nai + ものだ ; V-ru + ものではない", "(Là người thì) nên V/không nên V", "人の出会いは大切にするものだ。\n若いうちはもっと勉強するものだ。", ""], ["127", "Bài 24 · Khuyên nhủ, ý chí", "Aことはない", "V-ru + ことはない", "không cần/không nhất thiết phải A (khỏi A)", "たくさん頑張ったんだから、できなくてもがっかりすることはないよ！", ""], ["128", "Bài 24 · Khuyên nhủ, ý chí", "①Aまい\n②AようかAまいか", "V-ru + まい (Nhóm 2 còn dùng V-masu + まい) ;\nV-yoo + か + V-ru + まいか", "①Tôi quyết sẽ không làm A\n②Đắn đo A hay không A", "①こんなばかな失敗は二度とするまい。気を付けよう。\n②会社を辞めようか辞めるまいか、ずっと悩んでいる。", ""], ["129", "Bài 24 · Khuyên nhủ, ý chí", "Aものか", "V-ru +ものか", "Tôi tuyệt đối không A", "こんなにまずいケーキ、二度と食べるものか。", ""], ["130", "Bài 25 · Cảm xúc mạnh, buộc phải", "Aてしかたがない・\nAてしょうがない・\nAてたまらない", "V-te / Ai-くて / Ana-で + しかたがない / しょうがない / たまらない", "rất cảm xúc/cảm giác A", "さっき聞いた面白い話を誰かに話したくてしかたがない。\n夏のハノイは暑くてしょうがない。\nずっと会いたかった人に会えなくて、寂しくてたまらない。", ""], ["131", "Bài 25 · Cảm xúc mạnh, buộc phải", "Aてならない", "V-te / Ai-くて / Ana-で + ならない", "quá là cảm xúc A", "この歌を聞くと、学生時代のことが思い出されてならない。\nどうしてあんなことを言ってしまったのか、後悔されてならない。", ""], ["132", "Bài 25 · Cảm xúc mạnh, buộc phải", "Aないではいられない・\nAずにはいられない", "V-nai + ではいられない ;\nV-nai (bỏ ない) + ずにはいられない (する→せずにはいられない)", "Tôi không thể ngừng cảm xúc/không làm A (bản năng, cảm xúc)", "この曲が聞こえてくると、体を動かさないではいられない。", ""], ["133", "Bài 25 · Cảm xúc mạnh, buộc phải", "Aないわけにはいかない", "V-nai + わけにはいかない", "Không thể không làm A (hoàn cảnh/đạo đức)", "先輩に飲めと言われたので、飲まないわけにはいかない。", ""], ["134", "Bài 25 · Cảm xúc mạnh, buộc phải", "Aざるを得ない", "V-nai (bỏ ない) + ざるを得ない (する→せざるを得ない)", "Buộc/Đành phải A (không còn lựa chọn nào khác)", "週末も仕事で出かけざるを得ない。", ""], ["135", "Bài 26 · Mong muốn, hồi tưởng, cảm thán", "Aたいものだ・\nAてほしいものだ", "V-tai + ものだ ; V-te + ほしいものだ", "rất muốn làm A / mong ai đó làm A", "将来はこんな家に住みたいものだなあ。", ""], ["136", "Bài 26 · Mong muốn, hồi tưởng, cảm thán", "Aものだ", "①V-ta+ ものだ\n②TTT+ ものだ", "①Ngày xưa tôi hay A\n②Tôi thấy thật là A (よく・ずいぶん）", "子供のころは、夏になるとこの川で泳いだものです。\n卒業してからも10年か。時間が過ぎるのは早いものだ。", ""], ["137", "Bài 26 · Mong muốn, hồi tưởng, cảm thán", "Aないもの（だろう）か", "V-nai + ものか / ものだろうか", "Mong sao A có thể xảy ra", "どうにかして母の病気が治らないものか。", ""], ["138", "Bài 26 · Mong muốn, hồi tưởng, cảm thán", "Aものがある", "V-ru / V-nai / Adj-i / Adj-na-な + ものがある", "Có cái (cảm giác) thật là A", "毎日2時間もかけて通勤するのは、かなりつらいものがある。", ""], ["139", "Bài 26 · Mong muốn, hồi tưởng, cảm thán", "Aことだ", "Aiい / Ana-な + ことだ", "Việc này thật là A (đánh giá)", "使っていない紙をこんな捨てているなんて、もったいないことだ。", ""], ["140", "Bài 26 · Mong muốn, hồi tưởng, cảm thán", "Aことだろう・Aことか", "V-ru / V-ta / Ai い/ Ana-な + ことだろう / ことか", "A biết bao nhiêu (+何回・どんなに)", "「無駄遣いをするな」と子供にも何回注意したことか。", ""]], "N3": [["1", "Nhóm 01 · Thời điểm, thể & động từ ghép", "AとB／AたらB", "Vると／Vたら＋発見したこと（過去）", "Làm A xong thì tình cờ gặp / phát hiện B (B là việc thực tế, ngoài dự tính).", "本屋に行ったら、学生時代の友達に会った。", "A xong thì phát hiện B; khác điều kiện giả định."], ["2", "Nhóm 01 · Thời điểm, thể & động từ ghép", "Aていく", "Vて＋いく", "①Từ nay tiếp tục / dần A về sau. ②Làm A rồi đi xa điểm nhìn.", "これからも、日本語の勉強を続けていきたい。", "Từ hiện tại về sau; cũng có hướng đi xa điểm nhìn."], ["3", "Nhóm 01 · Thời điểm, thể & động từ ghép", "Aことがある", "Vる／Vない＋ことがある", "Cũng có lúc A xảy ra / có lúc làm A (không nói về kinh nghiệm đã từng).", "忙しい日は、昼ご飯を食べないことがある。", "Cũng có lúc; khác Vたことがある."], ["4", "Nhóm 01 · Thời điểm, thể & động từ ghép", "AままB", "Vた／Vない／Adj-i／Adj-na＋な／Nの＋まま", "Vẫn giữ nguyên trạng thái A mà làm / xảy ra B.", "眼鏡をかけたまま、寝てしまった。", "Giữ nguyên trạng thái."], ["5", "Nhóm 01 · Thời điểm, thể & động từ ghép", "AたびにB", "Vる／Nの＋たびに", "Cứ mỗi lần A xảy ra / làm A thì lại B.", "この写真を見るたびに、家族を思い出す。", "Mỗi lần A đều B."], ["6", "Nhóm 01 · Thời điểm, thể & động từ ghép", "Aてくる", "Vて＋くる", "①Từ trước đến nay dần A / bắt đầu A. ②Làm A rồi đến gần điểm nhìn.", "毎日練習して、少し自信がついてきた。", "Biến đổi đến hiện tại; hướng về điểm nhìn."], ["7", "Nhóm 01 · Thời điểm, thể & động từ ghép", "AうちにB", "V-ru／V-teiru／V-nai／Adj-i／Adj-na＋な／Nの＋うちに", "①Tranh thủ lúc còn A thì làm B trước khi A thay đổi. ②Trong lúc A tiếp diễn thì B dần thay đổi.", "若いうちに、いろいろな国を旅行したい。\n毎日話しているうちに、日本語が上手になった。", "①Tranh thủ còn A; ②Trong lúc A thì B thay đổi."], ["8", "Nhóm 01 · Thời điểm, thể & động từ ghép", "Aたばかりだ", "Vた＋ばかりだ", "Vừa mới làm A (người nói cảm thấy chưa lâu).", "このスマホは、昨日買ったばかりだ。", "Cảm giác vừa mới; không nhất thiết ngay trước lúc nói."], ["9", "Nhóm 01 · Thời điểm, thể & động từ ghép", "A間B／A間にB", "Vる／Vている／Adj-i／Adj-na＋な／Nの＋間（に）", "①Suốt khoảng thời gian A diễn ra thì B tiếp diễn. ②Trong khoảng thời gian A thì có việc B xảy ra.", "私が会議に出ている間に、荷物が届いた。", "間: suốt khoảng; 間に: một việc xảy ra trong khoảng."], ["10", "Nhóm 01 · Thời điểm, thể & động từ ghép", "A前にB", "Vる／Nの＋前に", "Làm / xảy ra B trước khi A xảy ra.", "メールを送る前に、名前を確認してください。", "Vる dù sự việc chính ở quá khứ."], ["11", "Nhóm 01 · Thời điểm, thể & động từ ghép", "A後でB", "Vた／Nの＋後で", "Sau khi A kết thúc thì làm / xảy ra B.", "仕事が終わった後で、一緒にご飯を食べよう。", "Vた＋後で."], ["12", "Nhóm 01 · Thời điểm, thể & động từ ghép", "AてからB", "Vて＋から", "Làm A xong rồi mới làm B (A trước, B sau).", "手を洗ってから、ご飯を食べてください。", "A xong rồi mới B."], ["13", "Nhóm 01 · Thời điểm, thể & động từ ghép", "AまでB", "Vる／N＋まで", "Tiếp tục B cho đến mốc A (A là thời điểm / sự việc kết thúc B).", "雨がやむまで、ここで待ちましょう。", "まで: hành động tiếp diễn đến mốc."], ["14", "Nhóm 01 · Thời điểm, thể & động từ ghép", "AまでにB", "N時間／Vる＋までに", "Hoàn tất B chậm nhất vào / trước mốc A.", "金曜日までに、レポートを出してください。", "までに: hoàn tất trước / đúng hạn."], ["15", "Nhóm 01 · Thời điểm, thể & động từ ghép", "AまでにはB", "N時間＋までには", "Chậm nhất thì đến mốc A cũng sẽ hoàn tất B (nhấn mạnh hạn cuối).", "遅くても、九時までには帰ります。", "は nhấn mạnh mốc giới hạn."], ["16", "Nhóm 01 · Thời điểm, thể & động từ ghép", "Aてしまう", "Vて＋しまう（Vで＋しまう）", "①Làm xong hẳn A. ②Lỡ làm / đã xảy ra A, khiến người nói tiếc hoặc bất ngờ.", "大事なメールを消してしまった。", "Lỡ / tiếc nuối; cũng dùng cho hoàn tất."], ["17", "Nhóm 01 · Thời điểm, thể & động từ ghép", "Aてある", "他動詞て＋ある", "A đã được ai đó làm sẵn và kết quả vẫn còn.", "机の上に、資料が並べてある。", "他動詞; trạng thái do ai đó chuẩn bị."], ["18", "Nhóm 01 · Thời điểm, thể & động từ ghép", "Aている／Aていた", "Vて＋いる／いた", "Đang A / đã đang A ở thời điểm được nhắc đến; hoặc trạng thái sau A vẫn còn.", "昨日電話したとき、彼はまだ寝ていた。", "Thì của trạng thái so với thời điểm đang nói tới."], ["19", "Nhóm 01 · Thời điểm, thể & động từ ghép", "Aるところだ", "Vる＋ところだ", "Đang sắp sửa làm A (chưa bắt đầu).", "今から昼ご飯を食べるところです。", "Sắp bắt đầu."], ["20", "Nhóm 01 · Thời điểm, thể & động từ ghép", "Aているところだ", "Vている＋ところだ", "Đúng lúc đang làm A (hành động đang tiếp diễn).", "今、昼ご飯を食べているところです。", "Đúng lúc đang làm."], ["21", "Nhóm 01 · Thời điểm, thể & động từ ghép", "Aたところだ", "Vた＋ところだ", "Vừa mới làm xong A ngay trước thời điểm đang nói.", "今、昼ご飯を食べたところです。", "Vừa mới hoàn tất."], ["22", "Nhóm 01 · Thời điểm, thể & động từ ghép", "Aたことがある", "V-ta＋ことがある", "Đã từng làm / trải qua A ít nhất một lần trước đây.", "京都に行ったことがあります。", "Kinh nghiệm; khác Vることがある."], ["23", "Nhóm 01 · Thời điểm, thể & động từ ghép", "A始める", "V-masu (bỏ ます)＋始める", "Bắt đầu làm A (A là hành động).", "宿題をやり始めたら、友達から電話が来た。", "Bắt đầu làm V; khác 終わる."], ["24", "Nhóm 01 · Thời điểm, thể & động từ ghép", "A続ける", "V-masu (bỏ ます)＋続ける", "Cứ tiếp tục làm A, không dừng lại trong khoảng thời gian đó.", "二人は、一時間も話し続けている。", "Hành động liên tục."], ["25", "Nhóm 01 · Thời điểm, thể & động từ ghép", "A出す", "V-masu (bỏ ます)＋出す", "Đột nhiên / bắt đầu làm A (nhấn mạnh lúc hành động khởi phát).", "傘を持っていないのに、雨が降り出した。", "Bắt đầu, thường đột ngột; khác động từ đơn 思い出す."], ["26", "Nhóm 01 · Thời điểm, thể & động từ ghép", "AずにB", "V-nai (bỏ ない)＋ずに（する→せずに）", "Không làm A mà làm B / B xảy ra trong tình trạng thiếu A.", "辞書を使わずに、日本語でメールを書いた。", "＝ないで; thiếu hành động kèm theo."], ["27", "Nhóm 01 · Thời điểm, thể & động từ ghép", "A直す", "V-masu (bỏ ます)＋直す", "Làm lại A để sửa hoặc làm cho tốt hơn.", "分かりにくいので、もう一度書き直します。", "Vます bỏ ます."], ["28", "Nhóm 01 · Thời điểm, thể & động từ ghép", "A終わる", "V-masu (bỏ ます)＋終わる", "Làm xong A, hành động A đã hoàn tất.", "この本を読み終わったら、貸してあげる。", "Hoàn tất một hành động."], ["29", "Nhóm 01 · Thời điểm, thể & động từ ghép", "Aやすい", "V-masu (bỏ ます)＋やすい", "Dễ làm A / A dễ xảy ra.", "このペンは書きやすい。", "Dễ làm V."], ["30", "Nhóm 01 · Thời điểm, thể & động từ ghép", "Aにくい", "V-masu (bỏ ます)＋にくい", "Khó làm A vì đặc điểm của đối tượng hoặc điều kiện thực hiện.", "この画面は、字が小さくて読みにくい。", "Khó làm V; không dùng Vる＋にくい."], ["31", "Nhóm 01 · Thời điểm, thể & động từ ghép", "Aすぎる", "V-masu (bỏ ます)／Adj-i (bỏ い)／Adj-na＋すぎる", "A quá mức cần thiết / bình thường (A là hành động hoặc tính chất).", "昨日、コーヒーを飲みすぎて眠れなかった。", "Quá mức."], ["32", "Nhóm 01 · Thời điểm, thể & động từ ghép", "AないでB", "Vない＋で", "Không làm A mà làm B (A là hành động được bỏ qua).", "今朝は、朝ご飯を食べないで出かけた。", "Không làm A mà làm B."], ["33", "Nhóm 01 · Thời điểm, thể & động từ ghép", "AなくてB", "V-nai (bỏ い)＋くて", "Không A nên B / không A và B (nối trạng thái phủ định, thường là lý do dẫn đến B).", "名前が思い出せなくて、困っている。", "Phủ định nối lý do; khác ないで."], ["34", "Nhóm 02 · Nguyên nhân, mục đích, lý do", "Aため（に）B", "V普通形／Adj-i／Adj-na＋な／Nの＋ため（に）", "Do A nên xảy ra B (A là nguyên nhân, B là kết quả).", "大雪のため、電車が止まった。", "Nguyên nhân; khác Vるために chỉ mục đích."], ["35", "Nhóm 02 · Nguyên nhân, mục đích, lý do", "AおかげでB", "V普通形／Adj-i／Adj-na＋な／Nの＋おかげで", "Nhờ A nên có kết quả tốt B (người nói biết ơn / đánh giá tích cực).", "先生のおかげで、試験に合格できた。", "Nhờ; kết quả tốt."], ["36", "Nhóm 02 · Nguyên nhân, mục đích, lý do", "AによってB／AによるB", "N＋によって／により／によるN", "Do A gây ra nên có B / B do A gây ra (A là nguyên nhân).", "台風によって、多くの家が壊れた。", "Nguyên nhân; phân biệt tùy theo."], ["37", "Nhóm 02 · Nguyên nhân, mục đích, lý do", "AせいでB", "V普通形／Adj-i／Adj-na＋な／Nの＋せいで", "Tại A nên xảy ra kết quả xấu B (thường có ý trách / tiếc).", "目覚ましが鳴らなかったせいで、寝坊した。", "Tại vì; thường là kết quả xấu."], ["38", "Nhóm 02 · Nguyên nhân, mục đích, lý do", "AようにB", "Vる／V可能／Vない＋ように", "Làm B để có thể A / để A không xảy ra (A là mục tiêu về khả năng hoặc trạng thái).", "後ろの人にも聞こえるように、大きな声で話してください。", "Khả năng・Vない; phân biệt ために."], ["39", "Nhóm 02 · Nguyên nhân, mục đích, lý do", "AためにB", "Vる／Nの＋ために", "Làm B để thực hiện A / vì lợi ích của A (A là mục đích hoặc người được hưởng lợi).", "日本で働くために、日本語を勉強している。", "Mục đích; V có ý chí."], ["40", "Nhóm 02 · Nguyên nhân, mục đích, lý do", "AためならB", "Vる／Nの＋ためなら", "Nếu là để thực hiện / vì lợi ích của A thì sẵn sàng B.", "家族を守るためなら、何でもする。", "Nếu vì mục đích đó thì sẵn sàng làm."], ["41", "Nhóm 02 · Nguyên nhân, mục đích, lý do", "AのだからB", "普通形＋のだから（N／Adj-na：なのだから）", "Vì A là điều đã rõ nên đương nhiên / nên làm B.", "せっかく日本に来たのだから、京都にも行こう。", "Lý do đã rõ; lời khuyên / ý chí."], ["42", "Nhóm 02 · Nguyên nhân, mục đích, lý do", "AだけにB", "N／普通形（Adj-na＋な）＋だけに", "Chính vì A nên cảm xúc / kết quả B càng rõ, càng mạnh hoặc càng dễ hiểu.", "楽しみにしていただけに、中止は残念だ。", "Chính vì kỳ vọng nên cảm xúc mạnh."], ["43", "Nhóm 02 · Nguyên nhân, mục đích, lý do", "AことからB", "V普通形／Adj-i／Adj-na＋な・である／Nである＋ことから", "Từ sự thật / đặc điểm A mà suy ra B hoặc có tên gọi B.", "駅に近いことから、このホテルは人気がある。", "Từ một sự thật suy ra lý do."], ["44", "Nhóm 02 · Nguyên nhân, mục đích, lý do", "AにはB", "Vる＋には／N＋には", "①Để làm A thì cần / khó ở điểm B. ②Đối với A thì có đánh giá B.", "この仕事を一人で終えるには、時間が足りない。", "Vるには: để làm… thì cần / khó…"], ["45", "Nhóm 02 · Nguyên nhân, mục đích, lý do", "AのにB", "Vる＋のに", "Để làm A thì cần / tốn / dùng B (B là thời gian, chi phí, phương tiện…).", "この料理を作るのに、一時間かかった。", "のに: công dụng / thời gian; không phải mặc dù."], ["46", "Nhóm 02 · Nguyên nhân, mục đích, lý do", "AのでB／AからB", "普通形＋ので／から（N／Adj-na：なので）", "Vì A nên B (A là lý do; B là kết quả, ý kiến hoặc hành động).", "電車が遅れたので、会議に間に合わなかった。", "N・Aな＋なので／だから."], ["47", "Nhóm 03 · Điều kiện, giả định, nghịch tiếp", "AならB", "普通形（N・Adj-na bỏ だ）＋なら", "Nếu nói đến / nếu định A thì tôi khuyên / đề nghị / đánh giá B.", "日本語を勉強するなら、この本がおすすめです。", "Nêu chủ đề / điều kiện rồi đưa lời khuyên."], ["48", "Nhóm 03 · Điều kiện, giả định, nghịch tiếp", "AたってB", "Vた＋って／Adj-i (bỏ い)＋くたって／Adj-na・N＋だって", "Dù A có xảy ra / đúng là A thì vẫn B (B khô るものだ。"], "127": ["たくさんがんばったんだから、できなくてもがっかりすることはないよ！"], "128": ["こんなばかなしっぱいはにどとするまい。きをつけよう。", "かいしゃをやめようかやめるまいか、ずっとなやんでいる。"], "129": ["こんなにまずいケーキ、にどとたべるものか。"], "130": ["さっききいたおもしろいはなしをだれかにはなしたくてしかたがない。", "なつのハノイはあつくてしょうがない。", "ずっとあいたかったひとにあえなくて、さびしくてたまらない。"], "131": ["このうたをきくと、がくせいじだいのことがおもいだされてならない。", "どうしてあんなことをいってしまったのか、こうかいされてならない。"], "132": ["このきょくがきこえてくると、からだをうごかさないではいられない。"], "133": ["せんぱいにのめといわれたので、のまないわけにはいかない。"], "134": ["しゅうまつもしごとででかけざるをえない。"], "135": ["しょうらいはこんないえにすみたいものだなあ。"], "136": ["こどものころは、なつになるとこのかわでおよいだものです。", "そつぎょうしてからも10ねんか。じかんがすぎるのははやいものだ。"], "137": ["どうにかしてははのびょうきがなおらないものか。"], "138": ["まいにち2じかんもかけてつうきんするのは、かなりつらいものがある。"], "139": ["つかっていないかみをこんなすてているなんて、もったいないことだ。"], "140": ["「むだづかいをするな」とこどもにもなんかいちゅういしたことか。"]}, "N3": {"1": ["ほんやにいったら、がくせいじだいのともだちにあった。"], "2": ["これからも、にほんごのべんきょうをつづけていきたい。"], "3": ["いそがしいひは、ひるごはんをたべないことがある。"], "4": ["めがねをかけたまま、ねてしまった。"], "5": ["このしゃしんをみるたびに、かぞくをおもいだす。"], "6": ["まいにちれんしゅうして、すこしじしんがついてきた。"], "7": ["わかいうちに、いろいろなくにをりょこうしたい。", "まいにちはなしているうちに、にほんごがじょうずになった。"], "8": ["このスマホは、きのうかったばかりだ。"], "9": ["わたしがかいぎにでているあいだに、にもつがとどいた。"], "10": ["メールをおくるまえに、なまえをかくにんしてください。"], "11": ["しごとがおわったあとで、いっしょにごはんをたべよう。"], "12": ["てをあらってから、ごはんをたべてください。"], "13": ["あめがやむまで、ここでまちましょう。"], "14": ["きんようびまでに、レポートをだしてください。"], "15": ["おそくても、きゅうじまでにはかえります。"], "16": ["だいじなメールをけしてしまった。"], "17": ["つくえのうえに、しりょうがならべてある。"], "18": ["きのうでんわしたとき、かれはまだねていた。"], "19": ["いまからひるごはんをたべるところです。"], "20": ["いま、ひるごはんをたべているところです。"], "21": ["いま、ひるごはんをたべたところです。"], "22": ["きょうとにいったことがあります。"], "23": ["しゅくだいをやりはじめたら、ともだちからでんわがきた。"], "24": ["ふたりは、いちじかんもはなしつづけている。"], "25": ["かさをもっていないのに、あめがふりだした。"], "26": ["じしょをつかわずに、にほんごでメールをかいた。"], "27": ["わかりにくいので、もういちどかきなおします。"], "28": ["このほんをよみおわったら、かしてあげる。"], "29": ["このペンはかきやすい。"], "30": ["このがめんは、じがちいさくてよみにくい。"], "31": ["きのう、コーヒーをのみすぎてねむれなかった。"], "32": ["けさは、あさごはんをたべないででかけた。"], "33": ["なまえがおもいだせなくて、こまっている。"], "34": ["おおゆきのため、でんしゃがとまった。"], "35": ["せんせいのおかげで、しけんにごうかくできた。"], "36": ["たいふうによって、おおくのいえがこわれた。"], "37": ["めざましがならなかったせいで、ねぼうした。"], "38 function exHTML(s,stt){const L=s.split("\n").map(l=>l.trim()).filter(Boolean),tr=(TR[stt]||[]).slice();
  return L.map((l,i)=>{if(isVi(l))return `<div class="vi">${esc(l)}</div>`;
    let h=`<div class="ja">${esc(l)}</div>`;
    if(!/^【.*】$/.test(l)&&!(L[i+1]&&isVi(L[i+1]))&&tr.length)h+=`<div class="vi">${esc(tr.shift())}</div>`;
    return h}).join("")}
function jaText(s){return s.split("\n").filter(l=>l.trim()&&!isVi(l)).join("。")}

function renderGroups(){
  const cnt={};ITEMS.forEach(i=>cnt[i.grp]=(cnt[i.grp]||0)+1);
  const names=["Tất cả",...GNAMES];
  $("groups").innerHTML=names.map(n=>`<button class="chip" data-g="${esc(n)}" aria-pressed="${n===group}">${esc(n)}<span class="n">${n==="Tất cả"?ITEMS.length:cnt[n]}</span></button>`).join("");
}
function filter(){
  const q=$("q").value.trim().toLowerCase(),only=$("onlyNew").checked;
  list=order.filter(i=>(group==="Tất cả"||i.grp===group)&&(!only||!ok.has(i.stt))&&(!q||(i.pat+i.form+i.mean+i.ex).toLowerCase().includes(q)));
  if(idx>=list.length)idx=Math.max(0,list.length-1);
}
function stats(){
  const pool=ITEMS.filter(i=>group==="Tất cả"||i.grp===group);
  const m=pool.filter(i=>ok.has(i.stt)).length;
  $("sTotal").textContent=pool.length;$("sOk").textContent=m;$("sLeft").textContent=pool.length-m;
}
function render(){
  filter();stats();
  const has=list.length>0;$("card").hidden=!has;$("empty").hidden=has;
  $("prev").disabled=idx<=0;$("next").disabled=idx>=list.length-1;
  $("count").textContent=has?`${idx+1} / ${list.length}`:"";
  renderPager();
  if(!has)return;
  const it=list[idx],done=ok.has(it.stt);
  $("card").classList.remove("flipped");
  $("fPat").innerHTML=br(it.pat);
  $("fForm").textContent=it.form?`【${firstLine(it.form)}】`:"";
  $("fGrp").textContent=it.grp;
  $("fStatus").textContent=done?"Đã thuộc":"Chưa thuộc";$("fStatus").classList.toggle("ok",done);
  $("bStt").textContent=`#${it.stt} · ${it.grp}`;
  $("bPat").innerHTML=br(it.pat);
  $("bMean").innerHTML=br(it.mean);
  $("bUseBox").hidden=!it.form.trim();$("bUse").innerHTML=br(it.form);
  $("bEx").innerHTML=exHTML(it.ex,it.stt);
  $("bNoteBox").hidden=!it.note.trim();$("bNote").innerHTML=br(it.note);
  document.querySelectorAll('[data-act="ok"]').forEach(b=>{b.setAttribute("aria-pressed",done);b.textContent=done?"✓ Đã thuộc":"✓ Đánh dấu đã thuộc"});
}
function renderPager(){
  const n=list.length,c=idx;if(!n){$("pager").innerHTML="";return}
  const s=new Set([0,n-1]);for(let k=c-2;k<=c+2;k++)if(k>=0&&k<n)s.add(k);
  const arr=[...s].sort((a,b)=>a-b);let h=`<button class="pg" data-go="${c-1}" ${c<=0?"disabled":""} aria-label="Trước">‹</button>`,last=-1;
  arr.forEach(k=>{if(k-last>1)h+=`<button class="pg" disabled>…</button>`;h+=`<button class="pg" data-go="${k}" aria-current="${k===c}">${k+1}</button>`;last=k});
  h+=`<button class="pg" data-go="${c+1}" ${c>=n-1?"disabled":""} aria-label="Sau">›</button>`;
  $("pager").innerHTML=h;
}
function go(k){if(k<0||k>=list.length)return;idx=k;render()}
function toggleOk(){const it=list[idx];if(!it)return;ok.has(it.stt)?ok.delete(it.stt):ok.add(it.stt);save();
  const keep=$("onlyNew").checked&&ok.has(it.stt);render();if(keep)render();}
function shuffle(){for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}idx=0;render()}
function speak(){const it=list[idx];if(!it||!window.speechSynthesis)return;speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance((READ[it.stt]?READ[it.stt].join("　"):jaText(it.ex)).replace(/[①②③]/g,""));u.lang="ja-JP";u.rate=.9;speechSynthesis.speak(u)}

$("groups").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;group=b.dataset.g;idx=0;renderGroups();render()});
$("q").addEventListener("input",()=>{idx=0;render()});
$("onlyNew").addEventListener("change",()=>{idx=0;render()});
$("prev").onclick=()=>go(idx-1);$("next").onclick=()=>go(idx+1);
$("pager").addEventListener("click",e=>{const b=e.target.closest("[data-go]");if(b&&!b.disabled)go(+b.dataset.go)});
$("card").addEventListener("click",e=>{
  const a=e.target.closest("[data-act]");
  if(a){e.stopPropagation();a.dataset.act==="ok"?toggleOk():shuffle();return}
  if(e.target.closest(".ico")){e.stopPropagation();
    const id=e.target.closest(".ico").id;
    if(id==="fCopy"){const t=list[idx].pat;navigator.clipboard?.writeText(t).catch(()=>{})}else speak();return}
  if(e.target.closest(".back .body")&&window.getSelection().toString())return;
  $("card").classList.toggle("flipped");
});
document.addEventListener("keydown",e=>{if(e.target.matches("input"))return;
  if(e.key==="ArrowLeft")go(idx-1);else if(e.key==="ArrowRight")go(idx+1);
  else if(e.key===" "){e.preventDefault();$("card").classList.toggle("flipped")}
  else if(e.key.toLowerCase()==="m")toggleOk();});
$("levels").addEventListener("click",e=>{const b=e.target.closest(".lv");if(b&&b.dataset.lv!==level)setLevel(b.dataset.lv)});
let start="N1";try{const s=localStorage.getItem("bunpou-level");if(s&&LV[s])start=s}catch(e){}
setLevel(start);
</script>
